
apiVersion: v1
kind: Pod
metadata:
  name: productcatalog-manual
  namespace: recovery-test
  labels:
    app: productcatalog-manual
spec:
  terminationGracePeriodSeconds: 5
  securityContext:
    fsGroup: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
  containers:
    - name: server
      image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/productcatalogservice:v0.10.7
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 3550
      env:
        - name: PORT
          value: "3550"
        - name: DISABLE_PROFILER
          value: "1"
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
      readinessProbe:
        grpc:
          port: 3550
        periodSeconds: 10
        timeoutSeconds: 1
        failureThreshold: 3
      livenessProbe:
        grpc:
          port: 3550
        periodSeconds: 10
        timeoutSeconds: 1
        failureThreshold: 3
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
