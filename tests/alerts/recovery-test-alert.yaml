
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: recovery-test-alert
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: recovery-test.rules
      rules:
        - alert: RecoveryTestPodNotReady
          expr: kube_pod_status_ready{namespace="recovery-test",pod=~"alert-test-.*",condition="true"} == 0
          for: 30s
          labels:
            severity: warning
            project: auto-recovery
          annotations:
            summary: "Recovery Test Pod Not Ready"
            description: "Pod {{ $labels.pod }} is not ready."
